name: Build APK NUX Wallet

on:
  push:
    branches: [mainnet]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter 3.47.7
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      # Runner ubuntu GitHub sudah membawa Android SDK + cmdline-tools.
      # Action setup-android sengaja tidak dipakai: versi barunya mencoba
      # memasang paket usang "tools" dan gagal.
      - name: Pasang platform dan build-tools Android
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -1)
          echo "Memakai sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-34" "platforms;android-35" "platforms;android-36" "build-tools;34.0.0" "build-tools;35.0.0" "build-tools;36.0.0"

      - name: Setup Rust dan target Android
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      # Folder android/ sudah ter-commit di repo (dengan INTERNET permission
      # di manifest main). flutter create hanya fallback kalau foldernya
      # hilang. Permission wajib dicek keras: template Flutter tidak
      # memasangnya di manifest main, dan APK release tanpa permission itu
      # tidak bisa jaringan sama sekali (kejadian uji HP 20 Okt 2026).
      - name: Pastikan scaffolding android + INTERNET permission
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --project-name nux_wallet .
          fi
          python3 - <<'PYEOF'
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p).read()
          perm = '<uses-permission android:name="android.permission.INTERNET"/>'
          if perm not in s:
              anchor = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
              assert anchor in s, "anchor manifest tidak ditemukan"
              s = s.replace(anchor, anchor + "\n    " + perm, 1)
              open(p, "w").write(s)
              print("INTERNET permission ditambahkan ke manifest main")
          assert perm in open(p).read(), "INTERNET permission tetap tidak ada!"
          print("manifest main OK: INTERNET permission ada")
          PYEOF

      # Token LSP mainnet TIDAK disimpan di repo (repo publik). Nilai asli
      # tinggal di GitHub Secret LSP_TOKEN_MAINNET dan disuntikkan ke
      # lib/config.dart hanya di dalam runner saat build mainnet berjalan.
      # Placeholder masih ada tapi secret kosong = build GAGAL keras; lebih
      # baik gagal daripada merilis APK dengan token kosong.
      - name: Isi token LSP mainnet dari Secrets
        env:
          LSP_TOKEN_MAINNET: ${{ secrets.LSP_TOKEN_MAINNET }}
        run: |
          if grep -q 'ISI_TOKEN_LSP_MAINNET' lib/config.dart; then
            if [ -z "$LSP_TOKEN_MAINNET" ]; then
              echo 'ERROR: secret LSP_TOKEN_MAINNET belum terpasang'
              exit 1
            fi
            python3 -c "import os; p='lib/config.dart'; s=open(p).read(); assert 'ISI_TOKEN_LSP_MAINNET' in s; open(p,'w').write(s.replace('ISI_TOKEN_LSP_MAINNET', os.environ['LSP_TOKEN_MAINNET'])); print('token mainnet terisi dari secret')"
            if grep -q 'ISI_TOKEN_LSP_MAINNET' lib/config.dart; then echo 'ERROR: placeholder token masih ada'; exit 1; fi
          else
            echo 'tidak ada placeholder token - langkah dilewati'
          fi

      # URL kanal update mainnet TIDAK disimpan di repo (repo
      # publik; aset mainnet belum boleh diakses publik sampai
      # pengumuman - keputusan NUX 2 Nov 2026): aplikasi membacanya
      # dari VPS sendiri. Berbeda dengan token di atas, secret
      # kosong TIDAK menggagalkan build - placeholder dibiarkan
      # dan kanal update nonaktif pada APK hasil build ini.
      - name: Isi URL update mainnet dari Secrets
        env:
          UPDATE_MAINNET_URL: ${{ secrets.UPDATE_MAINNET_URL }}
        run: |
          if grep -q 'ISI_URL_UPDATE_MAINNET' lib/services/update_service.dart 2>/dev/null; then
            if [ -n "$UPDATE_MAINNET_URL" ]; then
              python3 -c "import os; p='lib/services/update_service.dart'; s=open(p).read(); assert 'ISI_URL_UPDATE_MAINNET' in s; open(p,'w').write(s.replace('ISI_URL_UPDATE_MAINNET', os.environ['UPDATE_MAINNET_URL'])); print('URL update mainnet terisi dari secret')"
            else
              echo 'secret UPDATE_MAINNET_URL belum terpasang - kanal update mainnet nonaktif pada build ini'
            fi
          else
            echo 'tidak ada placeholder URL update - langkah dilewati'
          fi

      - name: Ambil dependency
        run: flutter pub get

      # [patch.crates-io] di rust/Cargo.toml binding menunjuk folder sibling
      # relatif (../../ldk-node, ../../rust-bitcoin, ../../rust-lightning),
      # jadi ketiga fork di-clone sebagai sibling salinan binding di pub-cache.
      - name: Clone fork patch Rust sebagai sibling binding
        run: |
          cd "${PUB_CACHE:-$HOME/.pub-cache}/git"
          # Hapus dulu: cache pub dari flutter-action bisa mengembalikan
          # clone lama, dan git clone menolak folder yang sudah ada.
          rm -rf ldk-node rust-bitcoin rust-lightning
          git clone --depth 1 --branch nux-spike https://github.com/Nusanian/ldk-node.git
          git clone --depth 1 https://github.com/Nusanian/rust-bitcoin.git
          git clone --depth 1 https://github.com/Nusanian/rust-lightning.git
          ls -d ldk-node rust-bitcoin rust-lightning

      # Perbaikan kompatibilitas cargokit dengan Gradle 9: project.exec sudah
      # dihapus dari Gradle modern, diganti layanan ExecOperations. Langkah ini
      # idempotent: kalau binding sudah kompatibel, tidak ada yang diubah.
      - name: Patch cargokit binding untuk Gradle 9
        run: |
          python3 - <<'PYEOF'
          import glob
          for f in glob.glob("/home/runner/.pub-cache/git/ldk-node-flutter-nux-*/cargokit/gradle/plugin.gradle"):
              s = open(f).read()
              if "project.exec {" not in s:
                  print("tidak perlu patch (binding sudah kompatibel Gradle 9):", f)
                  continue
              s = s.replace("import org.apache.tools.ant.taskdefs.condition.Os",
                            "import javax.inject.Inject\nimport org.gradle.process.ExecOperations\nimport org.apache.tools.ant.taskdefs.condition.Os", 1)
              s = s.replace("abstract class CargoKitBuildTask extends DefaultTask {\n",
                            "abstract class CargoKitBuildTask extends DefaultTask {\n\n    @Inject\n    abstract ExecOperations getExecOperations()\n", 1)
              s = s.replace("project.exec {", "execOperations.exec {")
              open(f, "w").write(s)
              print("patch diterapkan:", f)
          PYEOF

      # android/build.gradle binding masih compileSdk 33, padahal dependency
      # AndroidX-nya menuntut minimal 34 (cek AAR metadata gagal). Naikkan ke
      # 36 di salinan pub-cache. Idempotent seperti patch cargokit di atas.
      - name: Patch compileSdk binding ke 36
        run: |
          python3 - <<'PYEOF'
          import glob
          for f in glob.glob("/home/runner/.pub-cache/git/ldk-node-flutter-nux-*/android/build.gradle"):
              s = open(f).read()
              if "compileSdk = 33" not in s:
                  print("tidak perlu patch compileSdk:", f)
                  continue
              s = s.replace("compileSdk = 33", "compileSdk = 36")
              open(f, "w").write(s)
              print("patch compileSdk diterapkan:", f)
          PYEOF

      # Binding ldk_node: semua hasil codegen (Dart + Rust) sudah ter-commit,
      # jadi di sini tidak ada langkah codegen. Native .so dikompilasi
      # cargokit dari sumber rust/ di repo binding.
      # Wrapper Gradle di android/ repo masih menunjuk gradle-2.14.1 (2015),
      # yang tidak bisa membaca versi Java 17 dan tidak kompatibel dengan
      # AGP 9.1 di settings.gradle.kts. Samakan ke 9.3.1, versi template
      # Flutter 3.47.7 (templateDefaultGradleVersion di gradle_utils.dart).
      # Idempotent: kalau repo sudah diperbarui, tidak ada yang berubah.
      - name: Samakan versi Gradle wrapper dengan template Flutter
        run: |
          sed -i -E 's#gradle-[0-9.]+-all\.zip#gradle-9.3.1-all.zip#' android/gradle/wrapper/gradle-wrapper.properties
          grep distributionUrl android/gradle/wrapper/gradle-wrapper.properties

      # Keystore release dari GitHub Secrets. ATURAN KEAMANAN (repo publik):
      # file hasil decode tinggal di runner.temp — DI LUAR checkout — dan
      # tidak pernah di-upload (langkah unggah hanya mengambil *.apk dari
      # folder output Flutter); tidak ada langkah yang mencetak isi/nilai
      # secrets; langkah ini hanya jalan pada trigger tepercaya (push ke
      # main / dispatch manual — workflow ini memang tidak punya trigger
      # pull_request, jadi jalur PR fork tidak pernah menyentuh signing).
      - name: Siapkan keystore release dari Secrets
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "${{ runner.temp }}/nux-release.jks"
            chmod 600 "${{ runner.temp }}/nux-release.jks"
            echo "keystore release siap di runner.temp"
          else
            echo "secret keystore belum terpasang — build memakai signing debug"
          fi

      # Split per ABI agar tiap APK ramping (tidak memuat .so semua arsitektur).
      # versionCode otomatis dari nomor run CI (--build-number): selalu naik
      # tiap build tanpa bergantung ingatan manusia; satu rilis lupa naik
      # akan ditolak Android saat update.
      # Catatan: build.rs crate rs-x11-hash meng-hardcode compiler "clang",
      # jadi bin/ toolchain LLVM dari NDK ditaruh paling depan di PATH agar
      # "clang" yang ketemu adalah clang NDK (sysroot Android-nya lengkap).
      - name: Build APK release split per ABI
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/nux-release.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          NDK_BIN=$(ls -d "$ANDROID_HOME"/ndk/*/toolchains/llvm/prebuilt/linux-x86_64/bin | sort -V | tail -1)
          echo "Memakai clang NDK dari: $NDK_BIN"
          export PATH="$NDK_BIN:$PATH"
          which clang
          flutter build apk --release --split-per-abi --build-number=${{ github.run_number }}

      - name: Unggah APK
        uses: actions/upload-artifact@v4
        with:
          name: nux-wallet-apk
          path: build/app/outputs/flutter-apk/*.apk

      # ------- OTA mainnet: unggah ke VPS (BUKAN rilis GitHub) -------
      # Struktur di VPS: <UPDATE_VPS_PATH>/build-<run>/elnux-*.apk
      # + <UPDATE_VPS_PATH>/update.json sebagai penunjuk (ditulis
      # terakhir, lewat berkas .tmp + mv agar tidak terbaca
      # setengah). Retensi sama seperti testnet: hanya 2 build
      # terbaru dipertahankan. Semua secret opsional - tanpa
      # mereka, langkah unggah dilewati dan build tetap
      # menghasilkan artifact seperti biasa.
      - name: Siapkan aset rilis OTA + update.json
        env:
          UPDATE_JSON_BASE: "${{ secrets.UPDATE_MAINNET_URL }}"
        run: |
          mkdir -p ota
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ota/elnux-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk ota/elnux-armeabi-v7a.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk ota/elnux-x86_64.apk
          python3 - <<'PYEOF2'
          import hashlib, json, os
          run = os.environ['GITHUB_RUN_NUMBER']
          # UPDATE_MAINNET_URL adalah URL update.json itu sendiri;
          # basis alamat APK = direktorinya + folder build ini.
          raw = os.environ['UPDATE_JSON_BASE']
          if raw.endswith('/update.json'):
              raw = raw[:-len('/update.json')]
          base = raw.rstrip('/') + '/build-' + run
          def sha(p):
              return hashlib.sha256(open('ota/' + p, 'rb').read()).hexdigest()
          def notes(path, fallback):
              try:
                  s = open(path, encoding='utf-8').read().strip()
                  return s if s else fallback
              except OSError:
                  return fallback
          data = {
              'versi': 'Build ' + run,
              'versionCode': int(run),
              'sha256': sha('elnux-arm64-v8a.apk'),
              'urlUnduh': base + '/elnux-arm64-v8a.apk',
              'sha256V7a': sha('elnux-armeabi-v7a.apk'),
              'urlUnduhV7a': base + '/elnux-armeabi-v7a.apk',
              'sha256X64': sha('elnux-x86_64.apk'),
              'urlUnduhX64': base + '/elnux-x86_64.apk',
              'catatanId': notes('release_notes/id.txt',
                                 'Perbaikan dan peningkatan.'),
              'catatanEn': notes('release_notes/en.txt',
                                 'Fixes and improvements.'),
          }
          with open('ota/update.json', 'w', encoding='utf-8') as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
          print('update.json siap:', data['versi'], '| basis:', base)
          PYEOF2

      - name: Unggah OTA ke VPS + pangkas (sisa 2)
        env:
          UPDATE_MAINNET_URL: ${{ secrets.UPDATE_MAINNET_URL }}
          UPDATE_VPS_HOST: ${{ secrets.UPDATE_VPS_HOST }}
          UPDATE_VPS_PATH: ${{ secrets.UPDATE_VPS_PATH }}
          UPDATE_VPS_SSH_KEY: ${{ secrets.UPDATE_VPS_SSH_KEY }}
        run: |
          if [ -z "$UPDATE_MAINNET_URL" ] || [ -z "$UPDATE_VPS_HOST" ] || [ -z "$UPDATE_VPS_PATH" ] || [ -z "$UPDATE_VPS_SSH_KEY" ]; then
            echo 'secret kanal update mainnet belum lengkap - unggah OTA dilewati'
            exit 0
          fi
          mkdir -p ~/.ssh
          # Secret UPDATE_VPS_SSH_KEY berisi kunci ter-base64 SATU
          # baris (base64 -w0) — salinan multi-baris mentah terbukti
          # rusak di tengah jalan (run 76: 'Load key: error in
          # libcrypto' di runner, padahal kunci di VPS sehat).
          printf '%s' "$UPDATE_VPS_SSH_KEY" | base64 -d > ~/.ssh/ota_key
          chmod 600 ~/.ssh/ota_key
          RUN="${{ github.run_number }}"
          ssh -i ~/.ssh/ota_key -o StrictHostKeyChecking=accept-new "$UPDATE_VPS_HOST" "mkdir -p '$UPDATE_VPS_PATH/build-$RUN'"
          scp -i ~/.ssh/ota_key -o StrictHostKeyChecking=accept-new ota/elnux-arm64-v8a.apk ota/elnux-armeabi-v7a.apk ota/elnux-x86_64.apk "$UPDATE_VPS_HOST:$UPDATE_VPS_PATH/build-$RUN/"
          scp -i ~/.ssh/ota_key -o StrictHostKeyChecking=accept-new ota/update.json "$UPDATE_VPS_HOST:$UPDATE_VPS_PATH/update.json.tmp"
          ssh -i ~/.ssh/ota_key -o StrictHostKeyChecking=accept-new "$UPDATE_VPS_HOST" "mv '$UPDATE_VPS_PATH/update.json.tmp' '$UPDATE_VPS_PATH/update.json' && cd '$UPDATE_VPS_PATH' && ls -d build-* 2>/dev/null | sort -t- -k2 -n -r | tail -n +3 | xargs -r rm -rf"
          echo "OTA mainnet terunggah: build-$RUN"
